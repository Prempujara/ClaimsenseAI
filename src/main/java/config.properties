# ============================================================
#  ClaimSense AI - central application configuration
#  Loaded from the classpath (WEB-INF/classes/config.properties).
#  Change values here - never hard-code credentials in JSP/Java.
# ============================================================

# ---- MySQL (database name is locked to claimsense_ai) ----
db.url=jdbc:mysql://localhost:3306/claimsense_ai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
db.user=root
db.password=root
db.driver=com.mysql.cj.jdbc.Driver

# ---- Python OCR + ML micro-service (Flask) ----
ml.service.url=http://localhost:5000
ml.service.timeoutMs=8000

# ---- Receipt uploads (stored on disk, NOT in the DB) ----
# ${user.home} is expanded at runtime. Leave blank to use the default.
upload.dir=
